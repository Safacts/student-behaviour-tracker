<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Behavior Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div class="max-w-4xl mx-auto py-12 px-4">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-indigo-900 mb-2">Student Behavior Insights</h1>
            <p class="text-slate-600">Proof of Concept Dashboard for AI-Driven Reporting</p>
        </header>

        <div class="glass p-8 rounded-3xl shadow-xl mb-8">
            <label for="student-select" class="block text-sm font-semibold text-slate-700 mb-2">Select Student Profile</label>
            <select id="student-select" class="w-full p-4 bg-white border border-slate-200 rounded-2xl shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                <option value="" disabled selected>Choose a student...</option>
            </select>
        </div>

        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="mt-4 text-slate-600 font-medium">Analyzing behavioral data...</p>
        </div>

        <div id="report-container" class="hidden space-y-6">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500 font-medium">Total Study Time</p>
                    <p class="text-3xl font-bold text-indigo-600" id="stat-time">-</p>
                    <p class="text-xs text-slate-400">minutes / week</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500 font-medium">Avg Marks</p>
                    <p class="text-3xl font-bold text-indigo-600" id="stat-marks">-</p>
                    <p class="text-xs text-slate-400">percentile</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-sm text-slate-500 font-medium">Behavioral Tag</p>
                    <div id="stat-tag" class="mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                        -
                    </div>
                </div>
            </div>

            <!-- AI Report -->
            <div class="bg-indigo-900 text-white p-8 rounded-3xl shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="bg-indigo-500 p-2 rounded-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        </span>
                        <h2 class="text-xl font-bold">AI Parental Recommendation</h2>
                    </div>
                    <p id="ai-report" class="text-lg leading-relaxed text-indigo-100 italic">
                        Select a student to generate a report.
                    </p>
                </div>
                <div class="absolute -right-8 -bottom-8 w-48 h-48 bg-indigo-800 rounded-full opacity-50 blur-3xl"></div>
            </div>
        </div>
    </div>

    <script>
        const studentSelect = document.getElementById('student-select');
        const reportContainer = document.getElementById('report-container');
        const loading = document.getElementById('loading');

        // Fetch student list
        async function fetchStudents() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                students.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.name;
                    studentSelect.appendChild(option);
                });
            } catch (err) {
                console.error("Failed to fetch students", err);
            }
        }

        // Fetch report
        studentSelect.addEventListener('change', async (e) => {
            const studentId = e.target.value;
            reportContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`/api/report/${studentId}`);
                const data = await response.json();

                // Update UI
                document.getElementById('stat-time').textContent = `${data.stats.total_time}`;
                document.getElementById('stat-marks').textContent = `${data.stats.avg_marks}%`;
                
                const tagEl = document.getElementById('stat-tag');
                tagEl.textContent = data.analysis.tag;
                
                // Color logic for tags
                tagEl.className = "mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ";
                if(data.analysis.tag === 'High Flight Risk') tagEl.classList.add('bg-red-100', 'text-red-700');
                else if(data.analysis.tag === 'Concept Comprehension Issue') tagEl.classList.add('bg-amber-100', 'text-amber-700');
                else tagEl.classList.add('bg-green-100', 'text-green-700');

                document.getElementById('ai-report').textContent = data.ai_recommendation;

                loading.classList.add('hidden');
                reportContainer.classList.remove('hidden');
            } catch (err) {
                console.error("Error fetching report", err);
                loading.classList.add('hidden');
                alert("Failed to generate report. Check console.");
            }
        });

        fetchStudents();
    </script>
</body>
</html>
